<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Question Planner</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #5f6878;
    --border: #d7dbe2;
    --accent: #2f6fdb;
    --accent-text: #ffffff;
    --danger: #c43d3d;
    --danger-bg: #fdeeee;
    --ok-bg: #e9f6ee;
    --ok-text: #1f6b3a;
    --chip: #eef2f9;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --card: #1d2128;
      --text: #e7eaf0;
      --muted: #a0a8b6;
      --border: #343a45;
      --accent: #6a9cf0;
      --accent-text: #0f1420;
      --danger: #ef7d7d;
      --danger-bg: #3a1f22;
      --ok-bg: #1d3326;
      --ok-text: #8fd6a8;
      --chip: #262c36;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 16px 64px;
  }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 24px; }
  h2 { font-size: 1.15rem; margin: 0 0 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 24px;
  }

  .field { margin-bottom: 18px; }
  label, .label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .hint { font-weight: 400; color: var(--muted); font-size: 0.9rem; }

  input[type="text"], textarea {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  textarea { resize: vertical; min-height: 70px; }
  input:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  [aria-invalid="true"] { border-color: var(--danger); }

  .counter { text-align: right; font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

  .var-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  @media (max-width: 560px) {
    .var-row { grid-template-columns: 1fr auto; }
    .var-row .measure { grid-column: 1 / 2; }
    .var-row .remove-var { grid-row: 1 / 3; grid-column: 2; }
  }

  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    padding: 9px 16px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
    font-weight: 600;
  }
  button.icon { padding: 8px 12px; }
  button.danger { color: var(--danger); }
  button.danger:hover { border-color: var(--danger); background: var(--danger-bg); }

  .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

  .message {
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 16px;
    display: none;
  }
  .message.error { display: block; background: var(--danger-bg); color: var(--danger); }
  .message.ok { display: block; background: var(--ok-bg); color: var(--ok-text); }
  .message ul { margin: 4px 0 0; padding-left: 20px; }

  .entries-header { display: flex; justify-content: space-between; align-items: baseline; }
  .count { color: var(--muted); font-size: 0.9rem; }
  .empty { color: var(--muted); font-style: italic; }

  .entry {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 14px;
  }
  .entry-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .entry h3 { margin: 0; font-size: 1.05rem; }
  .entry .date { color: var(--muted); font-size: 0.85rem; margin: 2px 0 10px; }
  .entry dt { font-weight: 600; font-size: 0.9rem; color: var(--muted); margin-top: 10px; }
  .entry dd { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .chips { list-style: none; padding: 0; margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips li { background: var(--chip); border-radius: 999px; padding: 3px 12px; font-size: 0.9rem; }
  .chips .m { color: var(--muted); }

  .storage-warning { color: var(--danger); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Research Question Planner</h1>
  <p class="subtitle">Plan a research question, what you'll measure, and its limits. Entries are saved in this browser.</p>

  <section class="card" aria-labelledby="form-title">
    <h2 id="form-title">New entry</h2>
    <div id="form-message" class="message" role="alert"></div>

    <form id="entry-form" novalidate>
      <div class="field">
        <label for="question">Research question</label>
        <input type="text" id="question" maxlength="200"
               placeholder="e.g. Does the amount of sunlight affect how tall bean plants grow?">
      </div>

      <div class="field">
        <label for="why">Why it matters <span class="hint">(a short note)</span></label>
        <textarea id="why" maxlength="280" rows="2"
                  placeholder="e.g. Helps gardeners choose where to plant for better growth."></textarea>
        <div class="counter"><span id="why-count">0</span> / 280</div>
      </div>

      <div class="field">
        <span class="label" id="vars-label">Variables or measurements <span class="hint">(at least two)</span></span>
        <div id="var-list" aria-labelledby="vars-label"></div>
        <button type="button" id="add-var">+ Add variable</button>
      </div>

      <div class="field">
        <label for="limitation">One limitation</label>
        <textarea id="limitation" maxlength="280" rows="2"
                  placeholder="e.g. Only 10 plants, so results may not hold for all bean types."></textarea>
      </div>

      <div class="actions">
        <button type="button" class="primary" id="save-btn">Save entry</button>
        <button type="reset" id="clear-btn">Clear form</button>
      </div>
    </form>
  </section>

  <section class="card" aria-labelledby="saved-title">
    <div class="entries-header">
      <h2 id="saved-title">Saved entries</h2>
      <span class="count" id="entry-count"></span>
    </div>
    <p id="storage-warning" class="storage-warning" hidden>
      This browser is blocking storage, so entries will disappear when you close the page.
    </p>
    <div id="entries"></div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "research-planner-entries-v1";
  var MIN_VARS = 2;
  var storageWorks = true;

  // ---------- Storage ----------
  function loadEntries() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var data = raw ? JSON.parse(raw) : [];
      return Array.isArray(data) ? data : [];
    } catch (e) {
      storageWorks = false;
      return [];
    }
  }

  function saveEntries(list) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      storageWorks = true;
    } catch (e) {
      storageWorks = false;
    }
    document.getElementById("storage-warning").hidden = storageWorks;
  }

  var entries = loadEntries();

  // ---------- Elements ----------
  var form = document.getElementById("entry-form");
  var questionEl = document.getElementById("question");
  var whyEl = document.getElementById("why");
  var whyCount = document.getElementById("why-count");
  var limitationEl = document.getElementById("limitation");
  var varList = document.getElementById("var-list");
  var addVarBtn = document.getElementById("add-var");
  var messageEl = document.getElementById("form-message");
  var entriesEl = document.getElementById("entries");
  var countEl = document.getElementById("entry-count");

  // ---------- Variable rows ----------
  function addVarRow(name, measure) {
    var n = varList.children.length + 1;
    var row = document.createElement("div");
    row.className = "var-row";

    var nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.className = "name";
    nameInput.maxLength = 80;
    nameInput.placeholder = "Variable " + n + " (e.g. plant height)";
    nameInput.setAttribute("aria-label", "Variable " + n + " name");
    nameInput.value = name || "";

    var measureInput = document.createElement("input");
    measureInput.type = "text";
    measureInput.className = "measure";
    measureInput.maxLength = 80;
    measureInput.placeholder = "How measured (e.g. cm, ruler)";
    measureInput.setAttribute("aria-label", "Variable " + n + " measurement");
    measureInput.value = measure || "";

    var removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "icon remove-var danger";
    removeBtn.textContent = "✕";
    removeBtn.setAttribute("aria-label", "Remove variable " + n);
    removeBtn.addEventListener("click", function () {
      if (varList.children.length > MIN_VARS) {
        row.remove();
        refreshVarRows();
      }
    });

    row.appendChild(nameInput);
    row.appendChild(measureInput);
    row.appendChild(removeBtn);
    varList.appendChild(row);
    refreshVarRows();
    return nameInput;
  }

  // Renumber labels and disable remove buttons when only the minimum remain.
  function refreshVarRows() {
    var rows = varList.querySelectorAll(".var-row");
    rows.forEach(function (row, i) {
      var n = i + 1;
      row.querySelector(".name").setAttribute("aria-label", "Variable " + n + " name");
      row.querySelector(".measure").setAttribute("aria-label", "Variable " + n + " measurement");
      var btn = row.querySelector(".remove-var");
      btn.setAttribute("aria-label", "Remove variable " + n);
      btn.disabled = rows.length <= MIN_VARS;
    });
  }

  function resetVarRows() {
    varList.innerHTML = "";
    for (var i = 0; i < MIN_VARS; i++) addVarRow();
  }

  addVarBtn.addEventListener("click", function () {
    addVarRow().focus();
  });

  // ---------- Form helpers ----------
  whyEl.addEventListener("input", function () {
    whyCount.textContent = whyEl.value.length;
  });

  function showMessage(type, text, list) {
    messageEl.className = "message " + type;
    messageEl.textContent = text;
    if (list && list.length) {
      var ul = document.createElement("ul");
      list.forEach(function (item) {
        var li = document.createElement("li");
        li.textContent = item;
        ul.appendChild(li);
      });
      messageEl.appendChild(ul);
    }
  }

  function clearMessage() {
    messageEl.className = "message";
    messageEl.textContent = "";
  }

  function markInvalid(el, invalid) {
    if (invalid) el.setAttribute("aria-invalid", "true");
    else el.removeAttribute("aria-invalid");
  }

  function makeId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // ---------- Save ----------
  // The Save button is a plain button (type="button") with its own click listener.
  // A "submit" button relies on the browser submitting the form, which locked-down
  // previews (like the one in the chat) block, so the click would do nothing there.
  document.getElementById("save-btn").addEventListener("click", saveEntry);

  // Pressing Enter in a text box still tries to submit the form; stop the browser's
  // default page reload and run the same save code instead.
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    saveEntry();
  });

  function saveEntry() {
    clearMessage();

    var question = questionEl.value.trim();
    var why = whyEl.value.trim();
    var limitation = limitationEl.value.trim();
    var errors = [];
    var firstBad = null;

    markInvalid(questionEl, !question);
    if (!question) { errors.push("Enter a research question."); firstBad = firstBad || questionEl; }

    markInvalid(whyEl, !why);
    if (!why) { errors.push("Add a short note about why it matters."); firstBad = firstBad || whyEl; }

    // Collect variables: a row counts if it has a name. A measurement with no name is an error.
    var variables = [];
    varList.querySelectorAll(".var-row").forEach(function (row) {
      var nameEl = row.querySelector(".name");
      var name = nameEl.value.trim();
      var measure = row.querySelector(".measure").value.trim();
      var orphan = !name && !!measure;
      markInvalid(nameEl, orphan);
      if (orphan) {
        if (errors.indexOf("Give every measurement a variable name.") === -1) {
          errors.push("Give every measurement a variable name.");
        }
        firstBad = firstBad || nameEl;
      }
      if (name) variables.push({ name: name, measure: measure });
    });

    if (variables.length < MIN_VARS) {
      errors.push("Add at least " + MIN_VARS + " variables or measurements.");
      varList.querySelectorAll(".var-row .name").forEach(function (el) {
        if (!el.value.trim()) {
          markInvalid(el, true);
          firstBad = firstBad || el;
        }
      });
    }

    markInvalid(limitationEl, !limitation);
    if (!limitation) { errors.push("Add one limitation."); firstBad = firstBad || limitationEl; }

    if (errors.length) {
      showMessage("error", "Please fix the following:", errors);
      if (firstBad) firstBad.focus();
      return;
    }

    entries.unshift({
      id: makeId(),
      question: question,
      why: why,
      variables: variables,
      limitation: limitation,
      created: new Date().toISOString()
    });
    saveEntries(entries);
    render();

    form.reset();
    resetForm();
    showMessage("ok", storageWorks
      ? "Entry saved."
      : "Entry added, but this browser won't keep it after a refresh (see the note below).");
    questionEl.focus();
  }

  function resetForm() {
    whyCount.textContent = "0";
    resetVarRows();
    form.querySelectorAll("[aria-invalid]").forEach(function (el) { markInvalid(el, false); });
  }

  form.addEventListener("reset", function () {
    // Let the browser clear the fields first, then rebuild the variable rows.
    setTimeout(function () { resetForm(); clearMessage(); }, 0);
  });

  // ---------- Delete ----------
  function deleteEntry(id) {
    var entry = entries.find(function (x) { return x.id === id; });
    if (!entry) return;
    entries = entries.filter(function (x) { return x.id !== id; });
    saveEntries(entries);
    render();
  }

  // ---------- Render ----------
  function formatDate(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleString(undefined, {
      year: "numeric", month: "short", day: "numeric",
      hour: "numeric", minute: "2-digit"
    });
  }

  function addDetail(dl, label, text) {
    var dt = document.createElement("dt");
    dt.textContent = label;
    var dd = document.createElement("dd");
    dd.textContent = text;
    dl.appendChild(dt);
    dl.appendChild(dd);
  }

  function render() {
    entriesEl.innerHTML = "";
    countEl.textContent = entries.length === 1 ? "1 entry" : entries.length + " entries";

    if (!entries.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "No entries yet. Fill in the form above and click Save.";
      entriesEl.appendChild(p);
      return;
    }

    entries.forEach(function (entry) {
      var art = document.createElement("article");
      art.className = "entry";

      var top = document.createElement("div");
      top.className = "entry-top";
      var h3 = document.createElement("h3");
      h3.textContent = entry.question;
      var del = document.createElement("button");
      del.type = "button";
      del.className = "danger";
      del.textContent = "Delete";
      del.setAttribute("aria-label", "Delete entry: " + entry.question);
      // Two-click delete instead of a pop-up "Are you sure?" box, because previews
      // often block pop-ups. First click asks; a second click within 3 seconds deletes.
      del.addEventListener("click", function () {
        if (del.dataset.armed === "yes") {
          deleteEntry(entry.id);
          return;
        }
        del.dataset.armed = "yes";
        del.textContent = "Click again to delete";
        setTimeout(function () {
          del.dataset.armed = "";
          del.textContent = "Delete";
        }, 3000);
      });
      top.appendChild(h3);
      top.appendChild(del);

      var date = document.createElement("p");
      date.className = "date";
      date.textContent = "Saved " + formatDate(entry.created);

      var dl = document.createElement("dl");
      addDetail(dl, "Why it matters", entry.why);

      var dtVars = document.createElement("dt");
      dtVars.textContent = "Variables / measurements";
      var ddVars = document.createElement("dd");
      var ul = document.createElement("ul");
      ul.className = "chips";
      (entry.variables || []).forEach(function (v) {
        var li = document.createElement("li");
        li.textContent = v.name;
        if (v.measure) {
          var m = document.createElement("span");
          m.className = "m";
          m.textContent = " · " + v.measure;
          li.appendChild(m);
        }
        ul.appendChild(li);
      });
      ddVars.appendChild(ul);
      dl.appendChild(dtVars);
      dl.appendChild(ddVars);

      addDetail(dl, "Limitation", entry.limitation);

      art.appendChild(top);
      art.appendChild(date);
      art.appendChild(dl);
      entriesEl.appendChild(art);
    });
  }

  // ---------- Init ----------
  document.getElementById("storage-warning").hidden = storageWorks;
  resetVarRows();
  render();
})();
</script>
</body>
</html>
